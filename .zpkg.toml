[package]
org = "apostille-me"
name = "apme-libs"
version = "0.1.0"
description = "Shared contracts and runtime-light libraries for Apostille Me"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-libs"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "bash scripts/test.sh"

[dependencies]
"apostille-me/apme-interfaces" = "^0.1.0"
